[package]
name = "elora-client"
description = "Elora – das Spiel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "elora_client"
path = "src/lib.rs"

[[bin]]
name = "elora"
path = "src/main.rs"

[dependencies]
elora-sim = { workspace = true, features = ["serde"] }
elora-map.workspace = true
elora-adventure.workspace = true
elora-render.workspace = true
elora-audio = { workspace = true, features = ["playback"] }
winit.workspace = true
pollster.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
serde.workspace = true
toml.workspace = true
lyon.workspace = true
elora-protocol.workspace = true
elora-net.workspace = true
elora-server = { path = "../elora-server" }
elora-game.workspace = true
elora-master = { workspace = true, features = ["client"] }
# Ortszeit für die Tageszeit im Hauptmenü (E-291)
chrono.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
