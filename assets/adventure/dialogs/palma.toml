# Palma, keeper of the oasis (R2-M2.3, chapter 3)
speaker = "palma"

[[start]]
if = "quest oase schritt danke"
node = "danke"

[[start]]
if = "quest oase aktiv"
node = "erinnerung"

[[start]]
if = "quest oase erledigt"
node = "danach"

[[start]]
node = "begruessung"

[[node]]
id = "begruessung"
text = { de = "Leise, bitte. Die Oase schläft. Früher hat sie gesungen wie ein Bach im Frühling. Seit der Graue hier war, wird sie jeden Tag stiller. Drei Stellen am Ufer sind schon ganz verdorrt.", en = "Quietly, please. The oasis is sleeping. It used to sing like a brook in spring. Since the grey one was here, it grows quieter every day. Three patches on the bank have already withered completely." }

[[node.choice]]
tone = "freundlich"
text = { de = "Kann ich helfen?", en = "Can I help?" }
next = "auftrag"
do = ["zuneigung palma +1"]

[[node.choice]]
tone = "neugierig"
text = { de = "Wer ist der Graue?", en = "Who is the grey one?" }
next = "grauer"

[[node]]
id = "grauer"
text = { de = "Ich habe ihn nur von weitem gesehen. Er war … traurig, glaube ich. Wer so trinkt, hat großen Durst nach etwas, das Wasser nicht stillen kann.", en = "I only saw him from afar. He was … sad, I think. Whoever drinks like that thirsts for something water cannot quench." }
next = "auftrag"

[[node]]
id = "auftrag"
text = { de = "In den Ruinen gibt es noch eine kleine Quelle, tief zwischen den Säulen. Nimm meinen Wasserschlauch. Er fasst genug für alle drei Stellen.", en = "There is still a little spring in the ruins, deep between the pillars. Take my water skin. It holds enough for all three patches." }

[[node.choice]]
tone = "freundlich"
text = { de = "Ich bringe Wasser.", en = "I'll bring water." }
do = ["gib wasserschlauch 1", "quest oase start"]

[[node.choice]]
text = { de = "Vielleicht später.", en = "Maybe later." }

[[node]]
id = "erinnerung"
text = { de = "Der Schlauch fasst drei Schluck. Jede verdorrte Stelle braucht einen.", en = "The skin holds three sips. Each withered patch needs one." }

[[node]]
id = "danke"
text = { de = "Hörst du das? Sie summt wieder. Ganz leise, aber sie summt. Danke, kleiner Tropfen. Nimm diese Früchte – sie kühlen, wenn die Sonne zu sehr drückt.", en = "Can you hear that? It's humming again. Very softly, but it hums. Thank you, little drop. Take these fruits – they cool you when the sun presses too hard." }
do = ["zuneigung palma +2"]

[[node]]
id = "danach"
text = { de = "Pssst … die Oase summt.", en = "Shhh … the oasis is humming." }

[[bark]]
text = { de = "Im Schatten der Palmen ist es kühl.", en = "It's cool in the shade of the palms." }

[[bark]]
if = "quest oase erledigt"
text = { de = "Pssst … die Oase summt.", en = "Shhh … the oasis is humming." }
