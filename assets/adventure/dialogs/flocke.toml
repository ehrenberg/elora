# Flocke the mountain guide (R2-M2.4, chapter 4)
speaker = "flocke"

[[start]]
if = "quest climbers step report"
node = "report"

[[start]]
if = "quest frostspitzen step rope and has rope"
node = "rope_back"

[[start]]
if = "quest frostspitzen step rope"
node = "memory"

[[start]]
if = "not flag flocke.knows"
node = "greeting"

[[start]]
node = "after"

[[node]]
id = "greeting"
text = { de = "Ha! Endlich mal jemand, der nicht vor dem bisschen Schnee wegläuft! Ich bin Flocke, Bergführerin. Na ja – Bergführerin ohne Berg, seit der Gipfel zugefroren ist. Und ohne Seil. Das ist das eigentliche Problem.", en = "Ha! Finally someone who doesn't run away from a little snow! I'm Flocke, mountain guide. Well – mountain guide without a mountain, since the summit froze over. And without a rope. That's the real problem." }
do = ["flag flocke.knows = 1"]

[[node.choice]]
tone = "curious"
text = { de = "Was ist mit deinem Seil?", en = "What happened to your rope?" }
next = "rope"

[[node.choice]]
tone = "friendly"
text = { de = "Warum ist das Dorf so leer?", en = "Why is the village so empty?" }
next = "village"

[[node.choice]]
tone = "cheeky"
text = { de = "Bergführerin ohne Berg? Und ohne Seil?", en = "A mountain guide without a mountain? And without a rope?" }
next = "cheeky"
do = ["affection flocke +1"]

[[node]]
id = "village"
text = { de = "Die Leute sind ins Tal gezogen, als es kälter und kälter wurde. Kälter als normal, meine ich. Seit da oben etwas Graues herumstapft, friert sogar das Feuer.", en = "Everyone moved down to the valley when it got colder and colder. Colder than normal, I mean. Since something grey has been stomping around up there, even the fire freezes." }
next = "rope"
do = ["flag withered_one.mountains = 1"]

[[node]]
id = "cheeky"
text = { de = "HA! Frech! Gefällt mir.", en = "HA! Cheeky! I like that." }
next = "rope"

[[node]]
id = "rope"
text = { de = "Mein Seil liegt im Keller unter der alten Käserei. Ich wollte es holen, aber da unten hängen Fledermäuse mit Eiszapfen an den Flügeln. Ich mag Fledermäuse. Nur nicht, wenn sie mir ins Gesicht fliegen. Holst du es mir? Der Boden dort ist dünnes Eis – nicht trödeln!", en = "My rope is in the cellar under the old cheese dairy. I wanted to fetch it, but bats with icicles on their wings hang down there. I like bats. Just not when they fly into my face. Will you get it for me? The floor there is thin ice – don't dawdle!" }

[[node.choice]]
tone = "friendly"
text = { de = "Ich hole es.", en = "I'll get it." }

[[node.choice]]
tone = "curious"
text = { de = "Und dann?", en = "And then?" }
next = "then"

[[node]]
id = "then"
text = { de = "Dann gehen wir auf den Gipfel! Also, du. Ich halte das Seil.", en = "Then we climb the summit! Well, you do. I'll hold the rope." }

[[node]]
id = "memory"
text = { de = "Der Keller unter der Käserei. Dünnes Eis! Nicht stehen bleiben!", en = "The cellar under the cheese dairy. Thin ice! Don't stand still!" }

[[node]]
id = "rope_back"
text = { de = "Mein Seil! Glück, Mut und Abendbrot – alle drei Knoten noch dran! Hier, nimm dafür meine Steigkrallen. Damit hältst du dich an den Kletterwänden fest – an den rauen, gestreiften Felsen. Spring dagegen, halt dich fest, und dann: abspringen! Ganz einfach. Na ja. Fast.", en = "My rope! Luck, courage and supper – all three knots still there! Here, take my climbing claws for it. With them you can hold on to climbing walls – the rough, striped rocks. Jump at one, hold on, and then: jump off! Easy. Well. Almost." }
do = ["ability ice_grip", "affection flocke +1"]

[[node.choice]]
tone = "friendly"
text = { de = "Danke, Flocke!", en = "Thank you, Flocke!" }
next = "climbers"

[[node.choice]]
tone = "curious"
text = { de = "Wohin jetzt?", en = "Where to now?" }
next = "where_to"

[[node]]
id = "where_to"
text = { de = "Hoch! Durch den Kamin hinter meiner Hütte. Oben am Grat wird's stürmisch.", en = "Up! Through the chimney behind my hut. Up on the ridge it gets stormy." }
next = "climbers"

[[node]]
id = "climbers"
text = { de = "Ach, und … drei meiner Kletterer sind nicht zurückgekommen. Bolle, Kiesel und Wicke. Die drei sind gut, wirklich! Aber der Sturm … Wenn du sie siehst, schick sie heim. Ich mache Tee.", en = "Oh, and … three of my climbers haven't come back. Bolle, Kiesel and Wicke. They're good, really! But the storm … If you see them, send them home. I'll make tea." }

[[node.choice]]
tone = "friendly"
text = { de = "Ich halte die Augen offen.", en = "I'll keep my eyes open." }
do = ["quest climbers start", "affection flocke +1"]

[[node.choice]]
text = { de = "Vielleicht später.", en = "Maybe later." }

[[node]]
id = "after"
text = { de = "Na, kleiner Tropfen? Tee ist fertig – oder brauchst du was für unterwegs?", en = "Well, little drop? Tea is ready – or do you need something for the road?" }

[[node.choice]]
tone = "friendly"
text = { de = "Zeig mir deinen Vorrat.", en = "Show me your supplies." }
do = ["shop flocke"]

[[node.choice]]
tone = "curious"
if = "quest climbers new and ability ice_grip"
text = { de = "Was war mit deinen Kletterern?", en = "What about your climbers?" }
next = "climbers"

[[node.choice]]
text = { de = "Bis bald, Flocke.", en = "See you, Flocke." }

[[node]]
id = "report"
text = { de = "Alle drei sitzen an meinem Ofen und streiten, wer am längsten durchgehalten hat. Danke, kleiner Tropfen. Hier – meine alte Bommelmütze. Damit friert dir nicht mal die Laune ein.", en = "All three are sitting at my stove arguing about who held out the longest. Thank you, little drop. Here – my old bobble hat. With it, not even your mood will freeze." }
do = ["affection flocke +2"]

[[bark]]
text = { de = "Tee ist fertig!", en = "Tea is ready!" }

[[bark]]
text = { de = "Kälte ist nur Wärme, die gerade woanders ist.", en = "Cold is just warmth that happens to be somewhere else." }

[[bark]]
text = { de = "Am Feuer wird's wieder warm!", en = "By the fire you'll warm up again!" }
