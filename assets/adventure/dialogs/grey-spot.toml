text = { de = "Das Eis hier ist grau und stumpf, als hätte jemand alles Blau herausgetrunken. Daneben ein Abdruck im Schnee – ein großer, müder Fuß.", en = "The ice here is grey and dull, as if someone had drunk all the blue out of it. Next to it, a print in the snow – a large, weary foot." }
