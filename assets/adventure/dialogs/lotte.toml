# Lotte Lichtblau (A1.9, prologue)
speaker = "lotte"

[[start]]
if = "quest glutsand done and not flag lotte.desert"
node = "desert"

[[start]]
if = "quest murmelwald done and not flag lotte.forest"
node = "forest"

[[start]]
if = "not flag lotte.gift"
node = "first"

# sand boots only once the desert is in view (E-354)
[[start]]
if = "not quest glutsand new"
node = "shop_desert"

[[start]]
node = "shop"

[[node]]
id = "first"
text = { de = "Elora! Du willst los? Hier, ein Heiltrank – geht aufs Haus. Mit {taste:quick_heal} trinkst du ihn, wenn's brenzlig wird.", en = "Elora! Heading out? Here, a healing potion – on the house. Press {taste:quick_heal} to drink it when things get dicey." }
next = "shop"
do = ["give healing_potion 1", "flag lotte.gift = 1"]

[[node]]
id = "shop"
text = { de = "Frisch reingekommen: ein Strohhut! Hält Sonne und Regen ab.", en = "Fresh in: a straw hat! Keeps off sun and rain." }

[[node.choice]]
tone = "curious"
text = { de = "Zeig mal, was du hast.", en = "Show me what you've got." }
do = ["shop lotte"]

[[node.choice]]
tone = "friendly"
text = { de = "Dein Hut ist wunderschön, Lotte!", en = "Your hat is beautiful, Lotte!" }
next = "hut"
do = ["affection lotte +1"]

[[node.choice]]
text = { de = "Vielleicht später.", en = "Maybe later." }

[[node]]
id = "shop_desert"
text = { de = "Frisch reingekommen: Sandstiefel! Kaum gebraucht, nur ein bisschen verschluckt.", en = "Fresh in: sand boots! Barely used, only slightly swallowed." }

[[node.choice]]
tone = "curious"
text = { de = "Zeig mal, was du hast.", en = "Show me what you've got." }
do = ["shop lotte"]

[[node.choice]]
tone = "friendly"
text = { de = "Dein Hut ist wunderschön, Lotte!", en = "Your hat is beautiful, Lotte!" }
next = "hut"
do = ["affection lotte +1"]

[[node.choice]]
text = { de = "Vielleicht später.", en = "Maybe later." }

[[node]]
id = "hut"
text = { de = "Ach, du! Für dich gibt's bestimmt bald einen Freundschaftspreis.", en = "Oh, you! I'm sure there'll be a friendship price for you soon." }

[[node]]
id = "forest"
text = { de = "Elora! Mama Morchel hat mir Pilzsuppe gebracht – angeblich hilft sie bei allem. Hier, eine Schüssel für dich. Und erzähl mal: Laufende Bäume?!", en = "Elora! Mama Morel brought me mushroom soup – supposedly it helps with everything. Here, a bowl for you. And tell me: walking trees?!" }
next = "shop"
do = ["give mushroom_soup 1", "flag lotte.forest = 1"]

[[node]]
id = "desert"
text = { de = "Elora! Heute Morgen stand ein Kamel vor meinem Laden – mit einem Brief von Sirup! Er schickt dir Kaktusfrüchte. Und mir gleich eine Rechnung dazu. Hier, die gehören dir.", en = "Elora! This morning a camel was standing outside my shop – with a letter from Sirup! He's sending you cactus fruit. And me an invoice to go with it. Here, these are yours." }
next = "shop_desert"
do = ["give cactus_fruit 2", "flag lotte.desert = 1"]

[[bark]]
if = "quest frostspitzen done"
text = { de = "Kräutertee aus den Bergen – jetzt auch bei mir!", en = "Herbal tea from the mountains – now at my shop too!" }

[[bark]]
if = "quest glutsand done and not flag party"
text = { de = "Kaktusfrüchte! Stachelig außen, saftig innen!", en = "Cactus fruit! Prickly outside, juicy inside!" }

[[bark]]
if = "quest murmelwald done and not flag party"
text = { de = "Pilzsuppe, frisch aus dem Wald!", en = "Mushroom soup, fresh from the forest!" }

[[bark]]
if = "flag party"
text = { de = "Honigkuchen! Frisch aus dem Ofen!", en = "Honey cake! Fresh from the oven!" }

[[bark]]
text = { de = "Glitzerkram! Frisch reingekommen!", en = "Shiny stuff! Fresh in!" }
