# Lotte Lichtblau (A1.9, Prolog)
speaker = "lotte"

[[start]]
if = "nicht merker lotte.geschenk"
node = "erster"

[[start]]
node = "laden"

[[node]]
id = "erster"
text = { de = "Elora! Du willst los? Hier, ein Heiltrank – geht aufs Haus. Mit {taste:quick_heal} trinkst du ihn, wenn's brenzlig wird.", en = "Elora! Heading out? Here, a healing potion – on the house. Press {taste:quick_heal} to drink it when things get dicey." }
next = "laden"
do = ["gib heiltrank 1", "merker lotte.geschenk = 1"]

[[node]]
id = "laden"
text = { de = "Frisch reingekommen: Sandstiefel! Kaum gebraucht, nur ein bisschen verschluckt.", en = "Fresh in: sand boots! Barely used, only slightly swallowed." }

[[node.choice]]
tone = "neugierig"
text = { de = "Zeig mal, was du hast.", en = "Show me what you've got." }
do = ["laden lotte"]

[[node.choice]]
tone = "freundlich"
text = { de = "Dein Hut ist wunderschön, Lotte!", en = "Your hat is beautiful, Lotte!" }
next = "hut"
do = ["zuneigung lotte +1"]

[[node.choice]]
text = { de = "Vielleicht später.", en = "Maybe later." }

[[node]]
id = "hut"
text = { de = "Ach, du! Für dich gibt's bestimmt bald einen Freundschaftspreis.", en = "Oh, you! I'm sure there'll be a friendship price for you soon." }

[[bark]]
if = "merker fest"
text = { de = "Honigkuchen! Frisch aus dem Ofen!", en = "Honey cake! Fresh from the oven!" }

[[bark]]
text = { de = "Glitzerkram! Frisch reingekommen!", en = "Shiny stuff! Fresh in!" }
