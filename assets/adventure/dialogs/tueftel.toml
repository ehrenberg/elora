# Tüftel (A1.9, prologue)
speaker = "tueftel"

[[start]]
if = "quest frostspitzen step spark"
node = "spark4"

[[start]]
if = "quest glutsand step spark"
node = "spark3"

[[start]]
if = "quest murmelwald step spark"
node = "spark2"

[[start]]
if = "quest blossom_spring step spark"
node = "spark"

[[start]]
if = "quest well step tueftel"
node = "advice"

[[start]]
node = "workshop"

[[node]]
id = "advice"
text = { de = "Zur Quelle? Wenn man den Hook … nein, warte … ja! Halt {taste:hook} gedrückt, dann greift er an Erde und Holz. An Stein rutscht er ab, das merk dir. Probier's an meinem Übungsplatz hinter der Werkstatt!", en = "To the spring? If you take the hook … no, wait … yes! Hold {taste:hook} and it grabs earth and wood. It slips off stone, remember that. Try it at my practice ground behind the workshop!" }

[[node.choice]]
tone = "curious"
text = { de = "Und was ist das da auf deinem Kopf?", en = "And what's that on your head?" }
next = "pear"

[[node.choice]]
tone = "friendly"
text = { de = "Danke, Tüftel!", en = "Thanks, Tüftel!" }
next = "klonk"

[[node]]
id = "pear"
text = { de = "Meine Ideen-Birne! Leuchtet, wenn … na, du weißt schon.", en = "My idea bulb! It lights up when … well, you know." }
next = "klonk"
do = ["affection tueftel +1"]

[[node]]
id = "klonk"
text = { de = "Ach, und Klonk wollte dich auch noch sehen. Wegen … Hammer. Oder Hummel. Hammer, glaube ich.", en = "Oh, and Klonk wanted to see you too. About … hammer. Or bumblebee. Hammer, I think." }

[[node]]
id = "workshop"
text = { de = "Wenn ich nur … hmm. Bring mir einen Quellfunken, dann baue ich dir etwas Großartiges!", en = "If only I … hmm. Bring me a spring spark and I'll build you something marvellous!" }

[[node.choice]]
if = "level >= 2"
text = { de = "Zeig mir den Fähigkeitenbaum.", en = "Show me the skill tree." }
do = ["skills"]

[[node.choice]]
text = { de = "Bis später!", en = "See you later!" }

[[node]]
id = "spark"
text = { de = "Ein Quellfunke! Wenn man den … und dann … ja! Fertig! Dein Hook hat jetzt einen Ruck: Hängt er fest, drück {taste:ability}, und du schnellst hin.", en = "A spring spark! If you take it … and then … yes! Done! Your hook now has a jolt: once it's attached, press {taste:ability} and you shoot towards it." }
next = "yard"
do = ["ability hook-jerk", "flag springs_freed = 1", "flag freed.blossom_spring = 1", "flag party = 1", "flag yard.jerk = 1", "affection tueftel +1"]

[[node]]
id = "yard"
text = { de = "Hinten in meinem Hof hab ich was aufgemacht. Eine Strecke, die schafft man nur mit Ruck. Probier's aus! Und dann – ab zu Oma, die will feiern.", en = "I've opened something at the back of my yard. A course you can only manage with a jolt. Give it a try! And then – off to Oma, she wants to celebrate." }

[[node]]
id = "spark2"
text = { de = "Noch ein Quellfunke! Wenn ich den hier … und das da … umdrehe … Fertig! Dein Hook zieht jetzt Dinge zu dir: Schalter, Fundstücke, Beute. Einfach anhooken.", en = "Another spring spark! If I turn this … and that … around … Done! Your hook now pulls things to you: switches, finds, loot. Just hook them." }
next = "yard2"
do = ["ability pull_hook", "flag springs_freed = 2", "flag freed.moss_spring = 1", "flag party = 1", "flag yard.pull = 1", "affection tueftel +1"]

[[node]]
id = "yard2"
text = { de = "Im Hof hängt jetzt ein Zugschalter hoch oben. Hol ihn dir! Und dann – du weißt schon – Oma.", en = "There's a pull lever high up in the yard now. Go get it! And then – you know – Oma." }

[[node]]
id = "spark3"
text = { de = "Ein goldener Funke! Warm wie … nein, wärmer! Halt das mal. Und das. Und – stell dich da hin. Jetzt spring. Und jetzt RUNTER! Siehst du? Stampfen! Damit brichst du mürbe Böden und haust Gegner um. Probier's auf dem Übungsplatz, da hab ich dir was Bröseliges hingelegt.", en = "A golden spark! Warm as … no, warmer! Hold this. And this. And – stand over there. Now jump. And now DOWN! See? Stomp! It breaks crumbly floors and knocks enemies over. Try it at the practice ground, I've put something crumbly there for you." }
do = ["ability stomp", "flag springs_freed = 3", "flag freed.ember_spring = 1", "flag party = 1", "flag yard.stomp = 1", "affection tueftel +1"]

[[node]]
id = "spark4"
text = { de = "Blau! Eisblau! Und so kühl, dass meine Brille beschlägt. Gib mal deine Steigkrallen … *klirr* … *zisch* … So! Jetzt halten sie doppelt so lange, und wenn du an der Wand nach oben drückst, ziehst du dich sogar ein Stück hinauf. Kletterwände überall im Tauland – jetzt gehören sie dir!", en = "Blue! Ice blue! And so cool my glasses fog up. Give me your climbing claws … *clink* … *hiss* … There! Now they hold twice as long, and if you push up against the wall you even pull yourself up a bit. Climbing walls all over the Tauland – now they're yours!" }
do = ["flag ice_grip.strong = 1", "flag springs_freed = 4", "flag freed.frost_spring = 1", "flag party = 1", "affection tueftel +1"]

[[bark]]
if = "flag ice_grip.strong"
text = { de = "Steigkrallen-Version zwei. Bald drei.", en = "Climbing claws, version two. Three coming soon." }

[[bark]]
if = "flag yard.stomp"
text = { de = "Die Stampfplatte! Hast du sie schon … krawumm?", en = "The stomp plate! Have you … ka-boom'd it yet?" }

[[bark]]
if = "flag yard.jerk"
text = { de = "Hast du den Ruck schon ausprobiert?", en = "Have you tried the jolt yet?" }

[[bark]]
text = { de = "Hmm … ja … nein …", en = "Hmm … yes … no …" }
