# Weltkarte des Taulands (E-264, Weltbuch §2). pos: Lage 0..1; maps: Kartennamen beginnen so;
# music: Hintergrundmusik assets/music/<name>.ogg (E-285); party_music: beim Fest (Merker fest);
# spring: Quelle des Gebiets, befreit mit Merker befreit.<spring>; boss_music: Kampfmusik (sonst boss).
# hot: heißes Gebiet mit Hitze-Leiste (E-320); Schatten unter Dächern und in Zonen schatten…, Oase in Zonen oase….
# cold: kaltes Gebiet mit Kälte-Leiste (E-342); Dächer, Hüter-Arenen und Zonen feuer… wärmen.
# chapter/guardian: Kapitel und Hüter – nach dem Sieg Gewinn-Bildschirm mit victory und dem Ehrentitel honor.
# weather_gloomy / weather: Wetter beim Betreten (R2-W1) – trüb, solange die Quelle schweigt (ohne Quelle:
# bis clears_after_springs Quellen befreit sind), sonst weather; kind, weight, intensity = [von, bis], wind = [von, bis].
# Arenen der Hüter (…-arena) bleiben schön; eine Karte mit eigenem Wetter aus dem Editor geht vor.

