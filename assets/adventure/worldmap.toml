# World map of the Tauland (E-264, world book §2). pos: position 0..1; maps: map names start like this;
# music: background music assets/music/<name>.ogg (E-285); party_music: at the party (merker fest);
# spring: the region's spring, freed with merker befreit.<spring>; boss_music: battle music (otherwise boss).
# hot: hot region with heat bar (E-320); shade under roofs and in zones schatten…, oasis in zones oase….
# cold: cold region with cold bar (E-342); roofs, guardian arenas and zones feuer… give warmth.
# chapter/guardian: chapter and guardian – after the victory a win screen with victory and the honorary title honor.
# weather_gloomy / weather: weather on entering (R2-W1) – gloomy while the spring is silent (without a spring:
# until clears_after_springs springs are freed), otherwise weather; kind, weight, intensity = [from, to], wind = [from, to].
# Gloomy weather is mostly dry and grey, sometimes rain or a thunderstorm (E-353).
# guardian arenas (…-arena) stay fair; a map with its own weather from the editor takes precedence.

