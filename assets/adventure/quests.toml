goal = { type = "collect", item = "glitzerstein", count = 1 }

[[quest.step]]
id = "bringen"
text = { de = "Pip den Glitzerstein bringen", en = "Bring Pip the glitter stone" }
goal = { type = "bring", item = "glitzerstein", count = 1, to = "pip" }
