# Items of the adventure (proper names like Tauwinkel stay the same in English too, E-212)
# (P-20 to P-26). type = currency | equipment | consumable | material | key
# bonuses see crates/elora-adventure/src/data.rs (Bonus), e.g. { max_health = 1 } or { damage_pct = 10.0 }

[[item]]
id = "gleam_drops"
type = "currency"
name = { de = "Glanztropfen", en = "Gleam drops" }
desc = { de = "Die Währung von Tauwinkel.", en = "The currency of Tauwinkel." }

