# Enemy kinds of the adventure (R2-M1, A1.2). Starting values for playtesting.
#
# size          collision box (width, height) in units (Elora: 28 × 28)
# health        health (hammer 3, grenade up to 6, laser 5, stomp 3)
# touch_damage  damage on contact (E-232)
# small         can be pulled to Elora with the pull hook (E-233)
# boss          stays defeated (E-235)
# xp            experience for defeating it
# loot          loot: item, min, max, chance (0–1, default 1)
# behavior      type = walker | hopper | turret | flyer | diver and its values
#               diver (guardian from the air, R2-M2.1): sight, circle = [half width, half height],
#               speed, circle_ms, aim_ms, dive_speed, stun_ms, drop_ms/drop_speed/drop_damage
#               (falling projectiles), enrage_at, summon_at/summon/summon_max/summon_ms (share of health)
#               – vulnerable only while stunned on the ground (E-299)
#               flyer: speed, sight; hover (height above Elora), drop_ms/drop_damage/glow_ms (sparks)
#               leaper (dune worm, R2-M2.3): sight, speed, warn_ms, jump_x, jump_y, rest_ms
#               serpent (Sand Serpent): sight, speed, trail_ms, warn_ms, jump_x, jump_y, stun_ms,
#               enrage_at, double_at, sand_every_ms/sand_ms/sand_width (quicksand in the basin),
#               open_hits (dives down after this many hits), land_damage/land_radius (landing)
# armor         shell: only hits from above and stomp work (E-317)
# Graphics: assets/adventure/creatures/<name>.svg (parts `idle`, for the hopper also `air`;
#         guardians also `dive` and `stunned`)

[[creature]]
name = "spike_beetle"
