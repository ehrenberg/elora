    { item = "glanztropfen", min = 3, max = 5 },
    { item = "bernstein", min = 1, max = 1, chance = 0.25 },
]
behavior = { type = "turret", interval_ms = 2000, range = 420.0, shot_speed = 4.0, shot_damage = 2 }

[[creature]]
