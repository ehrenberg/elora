# Gegnerarten des Abenteuers (R2-M1, A1.2). Startwerte zum Anspielen.
#
# size          Kollisionsbox (Breite, Höhe) in Einheiten (Elora: 28 × 28)
# health        Leben (Hammer 3, Granate bis 6, Laser 5, Stampfen 3)
# touch_damage  Schaden bei Berührung (E-232)
# small         mit Heranhooken zu Elora ziehbar (E-233)
# boss          bleibt besiegt (E-235)
# xp            Erfahrung beim Besiegen
# loot          Beute: item, min, max, chance (0–1, Standard 1)
# behavior      type = walker | hopper | turret | flyer | diver und seine Werte
#               diver (Hüter aus der Luft, R2-M2.1): sight, circle = [halbe Breite, halbe Höhe],
#               speed, circle_ms, aim_ms, dive_speed, stun_ms, drop_ms/drop_speed/drop_damage
#               (fallende Geschosse), enrage_at, summon_at/summon/summon_max/summon_ms (Anteil des Lebens)
#               – verwundbar nur benommen am Boden (E-299)
# Grafik: assets/adventure/creatures/<name>.svg (Teile `idle`, beim Hüpfer zusätzlich `air`;
#         Hüter zusätzlich `dive` und `stunned`)

