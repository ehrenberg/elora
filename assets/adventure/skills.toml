# Skill tree at Tüftel's (E-242, docs/release-2/progression.md §2).
# branch = movement | combat | spring; requires = node above; ability = required region ability
# per_rank = effect per rank

# Movement
[[node]]
id = "quick_jerk"
branch = "movement"
ranks = 3
ability = "HookJerk"
per_rank = [{ jerk_cooldown_ms = -150 }]
name = { de = "Schneller Ruck", en = "Quick jerk" }
desc = { de = "Hook-Ruck lädt schneller nach.", en = "Hook jerk recharges faster." }

[[node]]
id = "far_hook"
branch = "movement"
ranks = 2
requires = "quick_jerk"
per_rank = [{ hook_length_pct = 5.0 }]
name = { de = "Weiter Hook", en = "Long hook" }
desc = { de = "Der Hook reicht weiter.", en = "The hook reaches further." }

[[node]]
id = "strong_stomp"
branch = "movement"
ranks = 3
requires = "far_hook"
ability = "Stomp"
per_rank = [{ stomp_radius = 16.0 }, { stomp_damage = 1 }]
name = { de = "Starkes Stampfen", en = "Heavy stomp" }
desc = { de = "Größere, stärkere Stoßwelle.", en = "Bigger, stronger shockwave." }

[[node]]
id = "firm_grip"
branch = "movement"
ranks = 2
requires = "strong_stomp"
ability = "Grip"
per_rank = [{ grip_ms = 400 }]
name = { de = "Fester Griff", en = "Firm grip" }
desc = { de = "Länger an Kletterwänden haften.", en = "Cling to climbing walls longer." }

[[node]]
id = "wide_glide"
branch = "movement"
ranks = 2
requires = "firm_grip"
ability = "Glide"
per_rank = [{ glide_fall = -0.4 }]
name = { de = "Weites Gleiten", en = "Far glide" }
desc = { de = "Beim Gleiten langsamer fallen.", en = "Fall more slowly while gliding." }

