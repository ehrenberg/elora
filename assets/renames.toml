# German → English id dictionary (R2-RF, RF-10 to RF-13, E-358).
#
# Ids are translated word by word: an id is split at `-`, `_`, `.` and a trailing number
# (`fest2` → `fest` + `2`); every word found in [words] is replaced, all other words stay
# (proper names like Tauwinkel, Klonk or Kristella, and words that are English already).
# A translation with `_` takes the separator of the id it lands in (`stachelkaefer-1` →
# `spike-beetle-1`, `munition_granate` → `ammo_grenade`).
#
# The same table converts old save games and old maps when they are loaded, so a word must
# never be removed once a release has shipped with it.
#
# [keywords]: the condition and effect language (RF-11); the German words are accepted for
# one more release.

