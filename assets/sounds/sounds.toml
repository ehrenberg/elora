# Elora – Sounds (M5.7, E-081, E-105, E-106, E-107).
#
# Zwei Quellen:
# 1. Tondateien `assets/sounds/files/<name>.wav` (CC0, Quellen in assets/SOURCES.md).
#    Import: cargo xtask sound-import <name> <datei> [start_s] [länge_s]
#    Eine Datei ersetzt den prozeduralen Klang gleichen Namens.
# 2. Prozedural (unten): je Sound `[name]` mit Gesamtlautstärke und Schichten
#    `[[name.layer]]`, Felder siehe crates/elora-audio/src/synth.rs. Behalten nach
#    der Hörprobe (E-106): Spawn, Tod, Waffenwechsel, Waffen-Pickup.
#
# Hörprobe: cargo xtask sound-preview   (schreibt target/sounds/*.wav)

# Lautstärke der Tondateien (alle beim Import auf −1 dBFS gebracht; 1 = unverändert)
[gain]
hammer_fire = 0.6
hammer_hit = 0.9
grenade_fire = 0.8
grenade_explode = 1.0
laser_fire = 0.7
laser_bounce = 0.5
no_ammo = 0.5
hook_fire = 0.5
hook_attach_ground = 0.7
hook_attach_player = 0.7
hook_no_attach = 0.6
jump = 0.5
air_jump = 0.6
land = 0.5
pain_short = 0.7
pain_long = 0.8
pickup_health = 0.7
pickup_armor = 0.7
pickup_respawn = 0.4
hit_confirm = 0.5
chat = 0.5
emote = 0.6
flag_grab_own = 0.7
flag_grab_enemy = 0.7
flag_drop = 0.6
flag_return = 0.6
flag_capture = 0.8

# ── Prozedural ───────────────────────────────────────────────────────────

[weapon_switch]        # Klacken
volume = 0.35
[[weapon_switch.layer]]
wave = "noise"
freq = 5000
sustain = 0.005
decay = 0.03
[[weapon_switch.layer]]
wave = "square"
freq = 900
delay = 0.03
sustain = 0.01
decay = 0.03
volume = 0.4

[death]                # „Blubb“ – Elora zerplatzt
volume = 0.6
[[death.layer]]
wave = "square"
freq = 500
slide = -3
duty = 0.4
duty_sweep = -1
vibrato = 0.1
vibrato_hz = 12
sustain = 0.1
decay = 0.35
[[death.layer]]
wave = "noise"
freq = 200
decay = 0.3
lowpass = 1500
volume = 0.4

[spawn]                # Glitzern, zwei Stufen
volume = 0.4
[[spawn.layer]]
wave = "sine"
freq = 440
arp = 1.5
arp_after = 0.06
sustain = 0.12
decay = 0.2
[[spawn.layer]]
wave = "sine"
freq = 880
delay = 0.06
arp = 1.5
arp_after = 0.06
sustain = 0.08
decay = 0.2
volume = 0.4

[pickup_weapon]        # Klack-klack beim Laden
volume = 0.45
[[pickup_weapon.layer]]
wave = "saw"
freq = 300
slide = 1.5
sustain = 0.05
decay = 0.1
lowpass = 2000
[[pickup_weapon.layer]]
wave = "square"
freq = 150
delay = 0.08
sustain = 0.02
decay = 0.1
