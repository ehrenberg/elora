# Elora – Sounds (M5.7, E-081, E-105, E-106, E-107).
#
# Two sources:
# 1. Sound files `assets/sounds/files/<name>.wav` (CC0, sources in assets/SOURCES.md).
#    Import: cargo xtask sound-import <name> <file> [start_s] [length_s]
#    A file replaces the procedural sound of the same name.
# 2. Procedural (below): per sound `[name]` with overall volume and layers
#    `[[name.layer]]`, fields see crates/elora-audio/src/synth.rs. Kept after
#    the listening test (E-106): spawn, death, weapon switch, weapon pickup.
#
# Listening test: cargo xtask sound-preview   (writes target/sounds/*.wav)

# Volume of the sound files (all brought to −1 dBFS on import; 1 = unchanged)
[gain]
chest_open = 0.6
ice_crack = 0.45
ice_break = 0.7
icicle_shatter = 0.6
snow_crunch = 0.6
hammer_fire = 0.6
