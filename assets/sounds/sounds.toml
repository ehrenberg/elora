# Elora – Sound-Parameter für den prozeduralen Generator (M5.7, E-081, E-105).
#
# Je Sound ein Abschnitt `[name]` mit Gesamtlautstärke und einer oder mehreren
# Schichten `[[name.layer]]`. Alle Felder siehe crates/elora-audio/src/synth.rs;
# fehlende Felder haben Standardwerte. Zeiten in Sekunden, Frequenzen in Hz,
# `slide` in Oktaven pro Sekunde.
#
# Hörprobe: cargo xtask sound-preview   (schreibt target/sounds/*.wav)

