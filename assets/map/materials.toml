# Materials of the playing field (M6.3, style A, E-139).
#
# Each material has an SVG file of the same name in materials/ with the parts
# cap / cap-left / cap-right / cap-single (cap on free top edges, optional)
# and detail-1 … detail-n (scattered in the interior, optional).
#
# The shape (round outer corners, outline on free edges) is generated by the game itself.
#
# body    fill colour
# radius  rounding of the outer corners in world units (tile = 32)
# details share of tiles with a detail (0 to 1)
# for     tile kinds for which the material can be chosen; the first material
#         of a tile kind is its default

[earth]
body = "#a87a52"
radius = 10
details = 0.3
for = ["solid"]

[sand]
body = "#d9b26f"
radius = 10
details = 0.35
for = ["solid"]

[snow]
body = "#8c7b70"
radius = 10
details = 0.25
for = ["solid"]

[stone]
body = "#566068"
radius = 5
details = 1.0
for = ["unhookable"]

[ice]
body = "#bfe6f5"
radius = 8
details = 0.35
for = ["ice"]

# Adventure (R2-M1, E-228, E-230)

[climb]
body = "#5f8a9a"
radius = 5
details = 1.0
for = ["climb"]

[crumble]
body = "#c49a68"
radius = 8
details = 1.0
for = ["crumble"]
