# Alternative zu Caddy: nginx vor dem Master (Zertifikat z. B. mit certbot).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elora.bastianswelt.de;

    ssl_certificate     /etc/letsencrypt/live/elora.bastianswelt.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elora.bastianswelt.de/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 16k;
    }
}
