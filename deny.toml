# cargo-deny (E-040). Project licence: GPL-3.0-only (E-020).

[graph]
all-features = true

[advisories]
version = 2
# "unmaintained" advisories are only warnings in `cargo xtask check` (`-W unmaintained`,
# E-048).
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# the list is kept ahead on purpose; do not report entries that are not used yet
unused-allowed-license = "allow"
# GPL-3.0 compatible licences of dependencies
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots: Mozilla root certificates for HTTPS to the master (E-127)
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# internal path dependencies (publish = false) are allowed
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
