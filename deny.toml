# cargo-deny (E-040). Projektlizenz: GPL-3.0-only (E-020).

[graph]
all-features = true

[advisories]
version = 2
# „unmaintained“-Meldungen werden von `cargo xtask check` per `-W unmaintained`
# nur als Warnung ausgegeben (E-048).
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Liste ist bewusst vorab gepflegt; noch nicht genutzte Einträge nicht melden
unused-allowed-license = "allow"
# GPL-3.0-kompatible Lizenzen für Abhängigkeiten
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# interne Pfad-Abhängigkeiten (publish = false) sind erlaubt
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
