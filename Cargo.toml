[workspace]
resolver = "3"
members = [
    "crates/elora-sim",
    "crates/elora-map",
    "crates/elora-render",
    "crates/elora-protocol",
    "crates/elora-net",
    "crates/elora-game",
    "apps/elora-client",
    "apps/elora-server",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
elora-sim = { path = "crates/elora-sim" }
elora-map = { path = "crates/elora-map" }
elora-render = { path = "crates/elora-render" }
elora-protocol = { path = "crates/elora-protocol" }
elora-net = { path = "crates/elora-net" }
elora-game = { path = "crates/elora-game" }

serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wgpu = "30.0.1"
winit = "0.30.13"
lyon = "1.0.19"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
notify = "8.2.0"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
usvg = { version = "0.48.1", default-features = false }
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
egui = { version = "0.36.2", default-features = false }
egui-wgpu = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false, features = ["wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Farben als 0xRRGGBB sind lesbarer ohne Trennzeichen
unreadable_literal = "allow"
# Physik-Code rechnet bewusst mit f32 <-> Ganzzahl (Quantisierung, E-021)
cast_possible_truncation = "allow"
cast_precision_loss = "allow"

[profile.dev]
# Simulation und Renderer sind auch im Debug-Build flüssig
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
